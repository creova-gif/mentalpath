# Supabase CLI configuration (local development + `supabase config push`).
# Auth settings here must match the production project; see DEPLOYMENT.md.
project_id = "mentalpath"

[db]
major_version = 17

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/login",
  "http://localhost:5173/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 12
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

# API function: verifies caller JWTs itself (and the gateway check stays on).
[functions.make-server-4d1a502d]
verify_jwt = true

# Stripe calls this directly with its own signature scheme — no Supabase JWT.
[functions.stripe-webhook]
verify_jwt = false
